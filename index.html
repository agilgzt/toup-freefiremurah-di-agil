<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FF TOP UP STORE</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#0f0f0f;
      color:white;
    }

    header{
      background:#ff6a00;
      padding:20px;
      text-align:center;
      font-size:28px;
      font-weight:bold;
    }

    .container{
      max-width:400px;
      margin:30px auto;
      background:#1b1b1b;
      padding:20px;
      border-radius:15px;
      box-shadow:0 0 15px rgba(255,106,0,0.5);
    }

    h2{
      text-align:center;
      margin-bottom:20px;
      color:#ff6a00;
    }

    label{
      display:block;
      margin-top:15px;
      margin-bottom:5px;
    }

    input, select{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#2b2b2b;
      color:white;
    }

    .diamond-list{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:15px;
    }

    .diamond{
      background:#2b2b2b;
      padding:15px;
      text-align:center;
      border-radius:10px;
      cursor:pointer;
      transition:0.3s;
    }

    .diamond:hover{
      background:#ff6a00;
    }

    button{
      width:100%;
      margin-top:20px;
      padding:15px;
      border:none;
      border-radius:10px;
      background:#ff6a00;
      color:white;
      font-size:18px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#ff8c33;
    }

    footer{
      text-align:center;
      padding:20px;
      margin-top:30px;
      color:#999;
    }
  </style>
</head>
<body>

<header>
  FF TOP UP STORE
</header>

<div class="container">
  <h2>Top Up Diamond Free Fire</h2>

  <label>ID Free Fire</label>
  <input type="text" placeholder="Masukkan ID FF">

  <label>Nomor WhatsApp</label>
  <input type="text" placeholder="08xxxxxxxxxx">

  <label>Pilih Diamond</label>

  <div class="diamond-list">
    <div class="diamond">70 DM<br>Rp10.000</div>
    <div class="diamond">140 DM<br>Rp20.000</div>
    <div class="diamond">355 DM<br>Rp50.000</div>
    <div class="diamond">720 DM<br>Rp100.000</div>
  </div>

  <label>Metode Pembayaran</label>
  <select>
    <option>QRIS</option>
    <option>DANA</option>
    <option>OVO</option>
    <option>GoPay</option>
  </select>

  <button>BELI SEKARANG</button>
</div>

<footer>
  © 2026 FF Top Up Store
</footer>

</body>
</html>
